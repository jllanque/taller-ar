<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Taller AR - ETN 1024</title>

    <!-- Versiones usadas (anótalas en el informe): A-Frame 1.3.0 y AR.js 3.4.5 -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Panel superior: nombre del estudiante (siempre visible) */
      #nombre {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font: 14px sans-serif;
        padding: 6px 10px;
        border-radius: 6px;
      }
      /* Panel inferior: botón y etiqueta, lejos del centro de la pantalla */
      #controles {
        position: fixed;
        bottom: 16px;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }
      #btnTamano {
        font: 16px sans-serif;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #1976d2;
        color: #fff;
      }
      #etiqueta {
        font: 16px sans-serif;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div id="nombre">Seminario de Telecomunicaciones ETN-1024</div>

    <div id="controles">
      <button id="btnTamano">Cambiar tamaño</button>
      <span id="etiqueta">Normal</span>
    </div>

    <!-- ESCENA: cámara real + seguimiento de marcadores -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;"
    >
      <!-- TARJETA A: marcador Hiro -> CUBO AZUL -->
      <a-marker preset="hiro">
        <a-entity id="grupoCubo" scale="1 1 1">
          <a-box
            position="0 0.5 0"
            color="#0000ff"
            material="opacity: 1"
          ></a-box>
        </a-entity>
      </a-marker>

      <!-- TARJETA B: marcador Kanji -> ESFERA ROJA -->
      <a-marker preset="kanji">
        <a-entity id="grupoEsfera" scale="1 1 1">
          <a-sphere position="0 0.5 0" radius="0.5" color="#ff0000"></a-sphere>
        </a-entity>
      </a-marker>

      <!-- Cámara: SIN figuras hijas aquí (si no, quedarían fijas en pantalla) -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Estado común para ambas figuras: false = Normal (1.0), true = Ampliado (1.5)
      let ampliado = false;

      const btn = document.getElementById("btnTamano");
      const etiqueta = document.getElementById("etiqueta");
      const grupoCubo = document.getElementById("grupoCubo");
      const grupoEsfera = document.getElementById("grupoEsfera");

      btn.addEventListener("click", () => {
        ampliado = !ampliado;
        const s = ampliado ? 1.5 : 1.0; // escala relativa
        const escala = `${s} ${s} ${s}`;
        grupoCubo.setAttribute("scale", escala);
        grupoEsfera.setAttribute("scale", escala);
        etiqueta.textContent = ampliado ? "Ampliado" : "Normal";
      });
    </script>
  </body>
</html>
